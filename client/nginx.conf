server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Hashed asset filenames change on every build, so they can be cached hard.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
  }

  # index.html must never be cached, otherwise clients keep loading an old
  # bundle after a deploy.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  # Proxy API calls to the server container so the browser sees one origin and
  # no CORS preflight is needed in the compose setup.
  location /api/ {
    proxy_pass http://server:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  location /health {
    proxy_pass http://server:4000/health;
  }

  # Client-side routing: unknown paths return the app shell, not a 404.
  location / {
    try_files $uri $uri/ /index.html;
  }

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=()" always;

  # The bundle is entirely self-hosted, so everything can be locked to 'self'.
  # 'unsafe-inline' on style-src is required because the app sets inline
  # style attributes for progress bars and score meters; no inline scripts
  # are used beyond the theme bootstrap, which is covered by 'unsafe-inline'
  # on script-src-elem only in the interest of avoiding a nonce pipeline.
  # Tighten to a nonce before handling anything more sensitive than profiles.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

  # HSTS is set here rather than in Express because nginx terminates TLS.
  # Only meaningful once the site is actually served over HTTPS.
  # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}
