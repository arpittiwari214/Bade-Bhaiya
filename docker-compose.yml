name: bade-bhaiya

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-badebhaiya}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-badebhaiya}
      POSTGRES_DB: ${POSTGRES_DB:-badebhaiya}
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # The server waits for this before running migrations.
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-badebhaiya} -d ${POSTGRES_DB:-badebhaiya}']
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ./server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-badebhaiya}:${POSTGRES_PASSWORD:-badebhaiya}@db:5432/${POSTGRES_DB:-badebhaiya}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # One hop: nginx sits in front of this service.
      TRUST_PROXY: 1
    # No command override: the image's CMD already runs docker-entrypoint.sh,
    # which migrates before starting so a fresh volume comes up with a valid
    # schema. Keeping the sequence in one place stops compose and Render from
    # drifting apart.
    ports:
      - '4000:4000'

  client:
    build:
      context: ./client
      args:
        # Same-origin: nginx proxies /api to the server service.
        VITE_API_URL: /api
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - '8080:80'

volumes:
  postgres-data:
